<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #030712;
  color: #00e5ff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

header {
  text-align: center;
}

h1 {
  letter-spacing: 8px;
  font-size: 40px;
  text-shadow: 0 0 20px #00e5ff;
}

.subtitle { color: #aab; }

.status {
  display: inline-block;
  padding: 8px 15px;
  border: 1px solid #00e5ff;
  border-radius: 20px;
  font-size: 13px;
}

.orb {
  width: 140px;
  height: 140px;
  margin: 25px auto;
  border-radius: 50%;
  border: 4px solid #00e5ff;
  box-shadow: 0 0 25px #00e5ff,
              inset 0 0 25px #00e5ff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 55px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  50% { transform: scale(1.06); }
}

.chat {
  height: 380px;
  overflow-y: auto;
  background: #08111f;
  border: 1px solid #00e5ff;
  border-radius: 15px;
  padding: 15px;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  line-height: 1.5;
}

.jarvis {
  background: #0b2030;
  color: white;
}

.user {
  background: #123b4a;
  color: white;
  text-align: right;
}

.command-area {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

input {
  flex: 1;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid #00e5ff;
  background: #08111f;
  color: white;
  font-size: 16px;
}

button {
  padding: 14px;
  margin: 4px;
  border: none;
  border-radius: 10px;
  background: #00e5ff;
  color: #001018;
  font-weight: bold;
}

.quick {
  margin-top: 15px;
  text-align: center;
}

.info {
  margin-top: 20px;
  padding: 15px;
  background: #08111f;
  border-radius: 12px;
  color: white;
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>J.A.R.V.I.S.</h1>
<div class="subtitle">Personal Artificial Intelligence Assistant</div>
<div class="status">● SYSTEM ONLINE</div>
</header>

<div class="orb">🤖</div>

<div class="chat" id="chat">

<div class="message jarvis">
<b>J.A.R.V.I.S:</b><br>
Good day, Prince. Systems online.<br>
Ask me anything, and I'll help you find the answer.
</div>

</div>

<div class="command-area">

<input
id="command"
placeholder="Ask J.A.R.V.I.S anything..."
onkeydown="if(event.key === 'Enter') runCommand()"
>

<button onclick="runCommand()">SEND</button>

</div>

<div class="quick">

<button onclick="askQuestion()">🤖 Ask AI</button>
<button onclick="searchWeb()">🌐 Search Web</button>
<button onclick="openCanvas()">📚 Canvas</button>
<button onclick="openHomework()">📝 Homework</button>

</div>

<div class="info">

⚡ <b>J.A.R.V.I.S FREE EDITION</b><br><br>

🤖 AI via ChatGPT<br>
🌐 Internet Search<br>
📚 UIC Canvas Access<br>
📝 Homework Dashboard

</div>

</div>

<script>

const chat = document.getElementById("chat");
const input = document.getElementById("command");

function addMessage(type, text) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.innerHTML =
    "<b>" +
    (type === "user" ? "YOU" : "J.A.R.V.I.S") +
    ":</b><br>" +
    escapeHTML(text);

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

function runCommand() {

  const question = input.value.trim();

  if (!question) return;

  addMessage("user", question);

  input.value = "";

  const lower = question.toLowerCase();

  if (lower.includes("open canvas")) {

    addMessage("jarvis", "Opening UIC Canvas.");

    window.open("https://uic.instructure.com", "_blank");

    return;
  }

  if (lower.includes("date")) {

    const today = new Date();

    addMessage(
      "jarvis",
      "Today is " + today.toDateString()
    );

    return;
  }

  if (
    lower.startsWith("search ") ||
    lower.includes("search the web")
  ) {

    searchGoogle(question);

    return;
  }

  addMessage(
    "jarvis",
    "🤖 I can send this question to ChatGPT for an intelligent answer."
  );

  setTimeout(() => {

    const answer = confirm(
      "Ask ChatGPT:\n\n" + question + "?"
    );

    if (answer) {

      openChatGPT(question);

    }

  }, 500);

}

function openChatGPT(question) {

  /*
  Opens ChatGPT.

  The question is copied to the clipboard
  when possible so you can paste it.
  */

  navigator.clipboard.writeText(question)
    .catch(() => {});

  window.open(
    "https://chatgpt.com",
    "_blank"
  );

}

function askQuestion() {

  const question = prompt(
    "What would you like to ask J.A.R.V.I.S?"
  );

  if (!question) return;

  addMessage("user", question);

  addMessage(
    "jarvis",
    "Opening ChatGPT and preparing your question."
  );

  openChatGPT(question);

}

function searchGoogle(query) {

  addMessage(
    "jarvis",
    "🌐 Searching the internet for: " + query
  );

  window.open(
    "https://www.google.com/search?q=" +
    encodeURIComponent(query),
    "_blank"
  );

}

function searchWeb() {

  const query = prompt(
    "What should J.A.R.V.I.S search for?"
  );

  if (query) {

    searchGoogle(query);

  }

}

function openCanvas() {

  window.open(
    "https://uic.instructure.com",
    "_blank"
  );

}

function openHomework() {

  addMessage(
    "jarvis",
    "📝 Homework dashboard is coming next. We can build a system where you manually add assignments and due dates."
  );

}

</script>

</body>
</html>
