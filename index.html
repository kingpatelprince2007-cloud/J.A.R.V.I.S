<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>J.A.R.V.I.S.</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #05080d;
    color: white;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 240px;
    background: #090e15;
    border-right: 1px solid #1d2935;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 30px;
}

.logo span {
    font-size: 12px;
    display: block;
    opacity: .5;
    letter-spacing: 2px;
    margin-top: 4px;
}

.nav button {
    width: 100%;
    padding: 14px;
    margin-bottom: 8px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: #b7c3cf;
    text-align: left;
    font-size: 15px;
    cursor: pointer;
}

.nav button:hover,
.nav button.active {
    background: #17222e;
    color: white;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 65px;
    border-bottom: 1px solid #1d2935;
    display: flex;
    align-items: center;
    padding: 0 20px;
    justify-content: space-between;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #8f9ba8;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 10px #4ade80;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message {
    max-width: 800px;
    margin: 0 auto 20px;
    display: flex;
    gap: 12px;
}

.avatar {
    min-width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #17222e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.bubble {
    background: #101821;
    padding: 14px 17px;
    border-radius: 16px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.user {
    flex-direction: row-reverse;
}

.user .bubble {
    background: #193247;
}

/* INPUT */

.input-area {
    padding: 15px 20px 20px;
    border-top: 1px solid #1d2935;
}

.input-box {
    max-width: 800px;
    margin: auto;
    display: flex;
    gap: 10px;
    background: #101821;
    border: 1px solid #263442;
    border-radius: 18px;
    padding: 8px;
}

textarea {
    flex: 1;
    resize: none;
    border: 0;
    outline: none;
    background: transparent;
    color: white;
    font-size: 16px;
    padding: 10px;
    min-height: 44px;
    max-height: 120px;
}

.send {
    border: 0;
    border-radius: 13px;
    width: 48px;
    background: #23445b;
    color: white;
    font-size: 19px;
    cursor: pointer;
}

.quick {
    max-width: 800px;
    margin: 10px auto 0;
    display: flex;
    gap: 8px;
    overflow-x: auto;
}

.quick button {
    white-space: nowrap;
    border: 1px solid #263442;
    background: #0d141c;
    color: #aeb9c5;
    border-radius: 20px;
    padding: 8px 12px;
}

/* PANELS */

.panel {
    display: none;
    padding: 25px;
    overflow-y: auto;
}

.panel.active {
    display: block;
}

.card {
    max-width: 800px;
    margin: 0 auto 15px;
    padding: 20px;
    background: #101821;
    border: 1px solid #263442;
    border-radius: 18px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid #263442;
}

.task button {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: #9ca8b4;
}

.task.done span {
    text-decoration: line-through;
    opacity: .5;
}

.add-task {
    display: flex;
    gap: 8px;
}

.add-task input {
    flex: 1;
    background: #080d13;
    border: 1px solid #263442;
    color: white;
    border-radius: 10px;
    padding: 12px;
}

.add-task button {
    border: 0;
    border-radius: 10px;
    padding: 12px 16px;
    background: #23445b;
    color: white;
}

/* MOBILE / IPAD */

@media (max-width: 800px) {
    .sidebar {
        width: 70px;
        padding: 12px 8px;
    }

    .logo {
        font-size: 0;
        text-align: center;
    }

    .logo::before {
        content: "J";
        font-size: 25px;
    }

    .logo span {
        display: none;
    }

    .nav button {
        text-align: center;
        font-size: 0;
        padding: 13px 5px;
    }

    .nav button::first-letter {
        font-size: 20px;
    }

    .header {
        padding: 0 12px;
    }

    .chat {
        padding: 15px 10px;
    }

    .input-area {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            J.A.R.V.I.S.
            <span>PERSONAL AI SYSTEM</span>
        </div>

        <div class="nav">

            <button class="active" onclick="showPage('chatPage', this)">
                💬 Chat
            </button>

            <button onclick="showPage('tasksPage', this)">
                📋 Tasks
            </button>

            <button onclick="showPage('webPage', this)">
                🌐 Web
            </button>

            <button onclick="showPage('filesPage', this)">
                📁 Files
            </button>

            <button onclick="clearChat()">
                🗑️ Clear
            </button>

        </div>

    </aside>


    <main class="main">

        <header class="header">

            <strong>J.A.R.V.I.S.</strong>

            <div class="status">
                <div class="dot"></div>
                ONLINE
            </div>

        </header>


        <!-- CHAT PAGE -->

        <section id="chatPage" class="chat">

            <div class="message">

                <div class="avatar">🤖</div>

                <div class="bubble">
                    Hello. I am J.A.R.V.I.S.

                    I am ready to assist you.

                    Ask me something, create a task, or search the web.
                </div>

            </div>

        </section>


        <!-- TASKS -->

        <section id="tasksPage" class="panel">

            <div class="card">

                <h2>📋 Tasks</h2>

                <div class="add-task">

                    <input
                        id="taskInput"
                        placeholder="Add a task..."
                    >

                    <button onclick="addTask()">
                        Add
                    </button>

                </div>

                <div id="taskList"></div>

            </div>

        </section>


        <!-- WEB -->

        <section id="webPage" class="panel">

            <div class="card">

                <h2>🌐 Web Search</h2>

                <p>
                    Search the internet from J.A.R.V.I.S.
                </p>

                <div class="add-task">

                    <input
                        id="searchInput"
                        placeholder="What do you want to search?"
                    >

                    <button onclick="webSearch()">
                        Search
                    </button>

                </div>

            </div>

        </section>


        <!-- FILES -->

        <section id="filesPage" class="panel">

            <div class="card">

                <h2>📁 Files</h2>

                <p>
                    Choose files from your iPad to work with them.
                </p>

                <input
                    type="file"
                    id="fileInput"
                    multiple
                    onchange="showFiles()"
                >

                <div id="fileList"></div>

            </div>

        </section>


        <!-- INPUT -->

        <div id="chatInputArea" class="input-area">

            <div class="input-box">

                <textarea
                    id="userInput"
                    placeholder="Ask J.A.R.V.I.S..."
                    rows="1"
                    onkeydown="handleKey(event)"
                ></textarea>

                <button
                    class="send"
                    onclick="sendMessage()"
                >
                    ➤
                </button>

            </div>

            <div class="quick">

                <button onclick="quickAsk('Explain this to me simply')">
                    Explain something
                </button>

                <button onclick="quickAsk('Help me make a study plan')">
                    Study plan
                </button>

                <button onclick="quickAsk('What can you do?')">
                    What can you do?
                </button>

            </div>

        </div>

    </main>

</div>


<script>

/* =========================
   CHAT
========================= */

const chat = document.getElementById("chatPage");

const input = document.getElementById("userInput");

function addMessage(text, user = false) {

    const message = document.createElement("div");

    message.className =
        "message " + (user ? "user" : "");

    message.innerHTML = `
        <div class="avatar">
            ${user ? "👤" : "🤖"}
        </div>

        <div class="bubble"></div>
    `;

    message.querySelector(".bubble").textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    saveChat();
}


function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, true);

    input.value = "";

    setTimeout(() => {

        const response = jarvisResponse(text);

        addMessage(response);

    }, 400);
}


function quickAsk(text) {

    input.value = text;

    sendMessage();

}


function handleKey(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();

    }

}


/* =========================
   BASIC JARVIS BRAIN
========================= */

function jarvisResponse(text) {

    const q = text.toLowerCase();

    if (
        q.includes("hello") ||
        q.includes("hi") ||
        q.includes("hey")
    ) {
        return "Hello. How can I assist you?";
    }

    if (
        q.includes("what can you do") ||
        q.includes("what do you do")
    ) {
        return `I can currently:

• Answer basic questions
• Help organize tasks
• Open web searches
• Work with files you select
• Save your tasks and conversation locally

The next version can connect me to a real AI model.`;
    }

    if (
        q.includes("study") ||
        q.includes("homework")
    ) {
        return "I can help you break your work into smaller tasks. Try adding your assignment to the Tasks section.";
    }

    if (
        q.includes("time")
    ) {
        return "Your current device time is " +
            new Date().toLocaleTimeString();
    }

    if (
        q.includes("date")
    ) {
        return "Today is " +
            new Date().toLocaleDateString();
    }

    if (
        q.includes("thank")
    ) {
        return "You're welcome.";
    }

    return `I received your request:

"${text}"

I am currently running in free offline mode.

To give me real AI reasoning, we can connect an AI API in the next step.`;
}


/* =========================
   NAVIGATION
========================= */

function showPage(page, button) {

    document
        .querySelectorAll(".chat, .panel")
        .forEach(el => el.style.display = "none");

    document
        .getElementById(page)
        .style.display = "block";

    document
        .querySelectorAll(".nav button")
        .forEach(btn => btn.classList.remove("active"));

    if (button)
        button.classList.add("active");

    const inputArea =
        document.getElementById("chatInputArea");

    inputArea.style.display =
        page === "chatPage" ? "block" : "none";

}


/* =========================
   TASKS
========================= */

let tasks =
    JSON.parse(localStorage.getItem("jarvisTasks") || "[]");


function saveTasks() {

    localStorage.setItem(
        "jarvisTasks",
        JSON.stringify(tasks)
    );

}


function renderTasks() {

    const list =
        document.getElementById("taskList");

    list.innerHTML = "";

    tasks.forEach((task, index) => {

        const div = document.createElement("div");

        div.className =
            "task " + (task.done ? "done" : "");

        div.innerHTML = `

            <input
                type="checkbox"
                ${task.done ? "checked" : ""}
                onchange="toggleTask(${index})"
            >

            <span>${escapeHTML(task.text)}</span>

            <button onclick="deleteTask(${index})">
                ✕
            </button>

        `;

        list.appendChild(div);

    });

}


function addTask() {

    const input =
        document.getElementById("taskInput");

    const text = input.value.trim();

    if (!text) return;

    tasks.push({
        text: text,
        done: false
    });

    input.value = "";

    saveTasks();

    renderTasks();

}


function toggleTask(index) {

    tasks[index].done =
        !tasks[index].done;

    saveTasks();

    renderTasks();

}


function deleteTask(index) {

    tasks.splice(index, 1);

    saveTasks();

    renderTasks();

}


/* =========================
   WEB SEARCH
========================= */

function webSearch() {

    const query =
        document.getElementById("searchInput")
        .value.trim();

    if (!query) return;

    window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query),
        "_blank"
    );

}


/* =========================
   FILES
========================= */

function showFiles() {

    const files =
        document.getElementById("fileInput").files;

    const list =
        document.getElementById("fileList");

    list.innerHTML = "";

    for (const file of files) {

        const div =
            document.createElement("div");

        div.className = "task";

        div.innerHTML = `
            📄 ${escapeHTML(file.name)}
        `;

        list.appendChild(div);

    }

}


/* =========================
   LOCAL CHAT STORAGE
========================= */

function saveChat() {

    localStorage.setItem(
        "jarvisChat",
        chat.innerHTML
    );

}


function loadChat() {

    const saved =
        localStorage.getItem("jarvisChat");

    if (saved) {

        chat.innerHTML = saved;

    }

}


function clearChat() {

    if (!confirm("Clear your J.A.R.V.I.S. conversation?"))
        return;

    localStorage.removeItem("jarvisChat");

    location.reload();

}


/* =========================
   SECURITY HELPER
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* START */

renderTasks();

loadChat();

</script>

</body>
</html>
