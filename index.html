<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S.</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #030712;
  color: #00e5ff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 25px;
}

header {
  text-align: center;
  margin-bottom: 20px;
}

h1 {
  letter-spacing: 10px;
  font-size: 42px;
  margin-bottom: 8px;
  text-shadow: 0 0 20px #00e5ff;
}

.subtitle {
  color: #aab;
}

.status {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 15px;
  border: 1px solid #00e5ff;
  border-radius: 20px;
  font-size: 13px;
}

.orb {
  width: 150px;
  height: 150px;
  margin: 25px auto;
  border-radius: 50%;
  border: 4px solid #00e5ff;
  box-shadow: 0 0 25px #00e5ff,
              inset 0 0 25px #00e5ff;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 55px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

.chat {
  background: #08111f;
  border: 1px solid #00e5ff;
  border-radius: 15px;
  padding: 15px;
  height: 380px;
  overflow-y: auto;
  margin-bottom: 15px;
}

.message {
  padding: 14px;
  margin: 12px 0;
  border-radius: 12px;
  line-height: 1.5;
}

.jarvis {
  background: #0b2030;
  color: white;
}

.user {
  background: #123b4a;
  color: white;
  text-align: right;
}

.command-area {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid #00e5ff;
  background: #08111f;
  color: white;
  font-size: 16px;
}

button {
  padding: 15px 20px;
  border: none;
  border-radius: 10px;
  background: #00e5ff;
  color: #001018;
  font-weight: bold;
  cursor: pointer;
}

.quick {
  margin-top: 20px;
  text-align: center;
}

.quick button {
  margin: 5px;
}

.info {
  margin-top: 25px;
  padding: 15px;
  background: #08111f;
  border-radius: 12px;
  border: 1px solid #173a4a;
  color: white;
}

.typing {
  opacity: 0.7;
  font-style: italic;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>J.A.R.V.I.S.</h1>
  <div class="subtitle">Personal Artificial Intelligence Assistant</div>
  <div class="status">● SYSTEM ONLINE</div>
</header>

<div class="orb">🤖</div>

<div class="chat" id="chat">

<div class="message jarvis">
<b>J.A.R.V.I.S:</b><br>
Good day, Prince. Systems are online.<br>
Ask me anything.
</div>

</div>

<div class="command-area">

<input
id="command"
placeholder="Ask J.A.R.V.I.S anything..."
onkeydown="if(event.key==='Enter') runCommand()"
>

<button onclick="runCommand()">SEND</button>

</div>

<div class="quick">

<button onclick="searchWeb()">🔎 Search Web</button>

<button onclick="openCanvas()">📚 Canvas</button>

<button onclick="openChatGPT()">💬 ChatGPT</button>

<button onclick="showHomework()">📝 Homework</button>

</div>

<div class="info">

⚡ <b>J.A.R.V.I.S V3</b><br><br>

🌐 Internet Search<br>
🤖 AI Brain Ready<br>
📚 UIC Tools<br>
📝 Homework System<br>
📱 App Shortcuts

</div>

</div>

<script>

const chat = document.getElementById("chat");
const commandInput = document.getElementById("command");


function addMessage(type, text) {

  const message = document.createElement("div");

  message.className = "message " + type;

  if (type === "user") {

    message.innerHTML =
    "<b>YOU:</b><br>" + escapeHTML(text);

  } else {

    message.innerHTML =
    "<b>J.A.R.V.I.S:</b><br>" + text;

  }

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

}


function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


async function runCommand() {

  const command = commandInput.value.trim();

  if (!command) return;

  addMessage("user", command);

  commandInput.value = "";

  const lower = command.toLowerCase();


  // OPEN CANVAS

  if (lower.includes("open canvas")) {

    addMessage("jarvis",
    "Opening UIC Canvas.");

    window.open(
    "https://uic.instructure.com",
    "_blank"
    );

    return;

  }


  // OPEN CHATGPT

  if (lower.includes("open chatgpt")) {

    addMessage("jarvis",
    "Opening ChatGPT.");

    window.open(
    "https://chatgpt.com",
    "_blank"
    );

    return;

  }


  // WEB SEARCH

  if (
    lower.startsWith("search ") ||
    lower.startsWith("search for ") ||
    lower.includes("search the web") ||
    lower.startsWith("look up ")
  ) {

    const query = command
      .replace(/search the web for/i, "")
      .replace(/search for/i, "")
      .replace(/search/i, "")
      .replace(/look up/i, "")
      .trim();

    addMessage(
    "jarvis",
    "🌐 Searching the internet for:<br><b>" +
    escapeHTML(query) +
    "</b>"
    );

    window.open(
    "https://www.google.com/search?q=" +
    encodeURIComponent(query),
    "_blank"
    );

    return;

  }


  // DATE

  if (
    lower.includes("date") ||
    lower.includes("what day")
  ) {

    const today = new Date();

    addMessage(
    "jarvis",
    "Today's date is:<br><b>" +
    today.toDateString() +
    "</b>"
    );

    return;

  }


  // HOMEWORK

  if (
    lower.includes("homework") ||
    lower.includes("assignment")
  ) {

    addMessage(
    "jarvis",
    "📝 Homework system activated.<br><br>" +
    "Soon I'll connect this to your assignment dashboard."
    );

    return;

  }


  // AI BRAIN PLACEHOLDER

  askAI(command);

}


async function askAI(command) {

  const typing = document.createElement("div");

  typing.className =
  "message jarvis typing";

  typing.id = "typing";

  typing.innerHTML =
  "<b>J.A.R.V.I.S:</b><br>Thinking...";

  chat.appendChild(typing);

  chat.scrollTop = chat.scrollHeight;


  /*
  IMPORTANT:

  This is where our REAL AI connection
  will go next.

  Your GitHub Pages website cannot safely
  store an API key.
  */


  setTimeout(() => {

    const typingMessage =
    document.getElementById("typing");

    if (typingMessage) {
      typingMessage.remove();
    }

    addMessage(
    "jarvis",

    "🤖 My AI brain is ready to be connected.<br><br>" +

    "The next step is connecting this website " +
    "to a secure AI backend so I can answer " +
    "your questions directly inside J.A.R.V.I.S."
    );

  }, 800);

}


function searchWeb() {

  const query =
  prompt("What should J.A.R.V.I.S search for?");

  if (!query) return;

  addMessage(
  "jarvis",
  "🌐 Searching the internet for:<br><b>" +
  escapeHTML(query) +
  "</b>"
  );

  window.open(
  "https://www.google.com/search?q=" +
  encodeURIComponent(query),
  "_blank"
  );

}


function openCanvas() {

  window.open(
  "https://uic.instructure.com",
  "_blank"
  );

}


function openChatGPT() {

  window.open(
  "https://chatgpt.com",
  "_blank"
  );

}


function showHomework() {

  addMessage(
  "jarvis",

  "📝 <b>HOMEWORK SYSTEM</b><br><br>" +

  "Future features:<br>" +

  "• View assignments<br>" +
  "• Track due dates<br>" +
  "• Study planning<br>" +
  "• Canvas integration"
  );

}

</script>

</body>
</html>
